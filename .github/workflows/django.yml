# .github/workflows/django.yml

name: Bajaj Dealership CI/CD

on:
  push:
    branches: [ main ]        # runs when you push to main
  pull_request:
    branches: [ main ]        # runs when you make a PR

jobs:
  build:
    runs-on: ubuntu-latest    # fresh linux machine every time

    steps:

      # 1. Get your code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Install your packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Check Django is configured correctly
      - name: Run Django checks
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DEBUG: "True"
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: "5432"
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_ADMIN_EMAIL: ${{ secrets.VAPID_ADMIN_EMAIL }}
          WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}
          FACEBOOK_URL: ${{ secrets.FACEBOOK_URL }}
          INSTAGRAM_URL: ${{ secrets.INSTAGRAM_URL }}
        run: |
          python manage.py check