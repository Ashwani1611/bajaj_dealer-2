{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-5 text-center py-5">
                <i class="bi {{ icon }} text-warning" style="font-size: 5rem;"></i>
                <h2 class="fw-bold mt-4 mb-2">{{ title }}</h2>
                <p class="text-muted mb-4">{{ message }}</p>
                <div class="d-flex gap-3 justify-content-center flex-wrap">
                    <a href="{% url 'home' %}" class="btn btn-dark px-4">Back to Home</a>
                    <a href="{% url 'bike_list' %}" class="btn btn-warning px-4">Explore Bikes</a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
